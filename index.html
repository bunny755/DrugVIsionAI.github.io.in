<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Drug Vision AI</title>

    <link rel="stylesheet"
    href="style.css">

    <!-- TensorFlow -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>

    <!-- Teachable Machine -->
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

</head>

<body>

    <div class="container">

        <h1>Drug Vision AI</h1>

        <p class="subtitle">

            Smart AI Herbal Drug Detection System

        </p>

        
<!-- SEARCH BAR -->

<div class="search-container">

    <input
        type="text"
        id="searchInput"
        placeholder="Search Herbal Drug..."
    >

    <button onclick="searchDrug()">

        Search

    </button>

</div>
    

        <!-- DETECT -->
        <button onclick="captureAndPredict()">

            Capture & Detect

        </button>

        <br><br>

        <!-- CAMERA -->
        <div id="webcam-container"></div>

        <br>
        
<button onclick="init('environment')">

    Start Camera

</button>
        <!-- RESULT -->
        <div id="label-container"></div>

        <!-- DRUG INFO -->
        <div id="drug-info"></div>

    </div>

    <script src="script.js"></script>

</body>



</html>
